[package]
name = "liq-sim"
version = "0.1.0"
edition = "2021"

# Offline core of an Aave V3 liquidation simulator — a Rust port of a
# Python reference implementation. No networking: all on-chain values
# are inputs; the math is a faithful port with no silent 'improvements'.
[dependencies]
alloy-primitives = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
